# Render Blueprint for the ExpenseEye API.
# Docs: https://render.com/docs/blueprint-spec
#
# This provisions the Flask backend. The React frontend is deployed separately
# on Cloudflare Pages (root dir: viewer, build: `npm run build`, output: dist).
#
# After the first deploy, set CORS_ORIGINS in the Render dashboard to your
# Cloudflare Pages URL (e.g. https://<project>.pages.dev) so the browser is
# allowed to call this API.
services:
  - type: web
    name: expenseeye-api
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    # gunicorn, not `python api/app.py`: Werkzeug's built-in server is a
    # development server and prints so on boot. Sizing is measured, not
    # guessed -- a warmed worker holds ~168 MB (pandas + statsmodels +
    # scikit-learn) against the free plan's 512 MB, on 0.1 CPU. A second
    # worker would double memory while contending for the same CPU slice, so
    # concurrency comes from threads instead.
    #
    # --timeout 120 matters: the default is 30s, and /forecast alone measured
    # 17s on 25k rows here. A large upload plus processing would exceed 30s and
    # gunicorn would kill the worker mid-request, surfacing as a 502.
    startCommand: gunicorn api.app:app --workers 1 --threads 4 --worker-class gthread --timeout 120 --graceful-timeout 30 --bind 0.0.0.0:$PORT --access-logfile -
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Set this in the dashboard to your Cloudflare Pages origin (not synced
      # from the repo so it can differ per environment). Comma-separate for
      # multiple origins. Defaults to "*" in code if unset.
      - key: CORS_ORIGINS
        sync: false
