<html lang="en">

    <link rel="alternate icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05080e" />
    <meta name="description" content="ExpenseEye — see where your money goes. Private, ML-powered expense analytics." />
    <title>ExpenseEye — Drop. Parse. Know.</title>

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ExpenseEye" />
    <meta property="og:url" content="https://expenseeye.pages.dev/" />
    <meta property="og:title" content="ExpenseEye — Drop. Parse. Know." />
    <meta property="og:description" content="Drop in a bank statement and read it like an analyst would: next-month cash-flow forecasts, anomaly flags, and the subscriptions you forgot about. Open source, self-hostable, nothing kept." />

    <meta name="twitter:title" content="ExpenseEye — Drop. Parse. Know." />

    <meta name="twitter:image" content="https://expenseeye.pages.dev/apple-touch-icon.png" />
    <!-- Apply the saved/system theme before first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') {
            t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.classList.toggle('light', t === 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
